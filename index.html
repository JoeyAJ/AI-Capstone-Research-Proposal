<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10/14 피드백 반영 보고 · AI 캡스톤프로젝트 2</title><style>
:root{--bg:#f4f6f8;--paper:#fff;--ink:#172033;--muted:#657084;--line:#dce2e9;--accent:#2f5f96;--accent2:#eaf1f8}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,"Noto Sans KR","Noto Sans TC","Malgun Gothic",Arial,sans-serif;background:var(--bg);color:var(--ink)}
body{overflow:hidden}header{height:58px;display:flex;align-items:center;gap:12px;padding:0 22px;background:#fff;border-bottom:1px solid var(--line)}
.brand{font-weight:750;letter-spacing:.02em;margin-right:auto}button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;font-size:14px;cursor:pointer;color:var(--ink)}button:hover,button.active{background:var(--accent2);border-color:#b9cbe0}.progress{height:3px;background:#dce2e9}.bar{height:100%;background:var(--accent);width:0;transition:.2s}
main{height:calc(100vh - 61px);display:grid;grid-template-columns:205px 1fr}aside{background:#fff;border-right:1px solid var(--line);overflow:auto;padding:10px 7px}.toc{display:block;width:100%;text-align:left;margin:4px 0;border:0;border-radius:7px;padding:7px 8px;background:transparent;color:#556174;font-size:12px;line-height:1.25}.toc.active{background:var(--accent2);color:#183d67;font-weight:700}
.stage{display:flex;align-items:stretch;justify-content:stretch;padding:10px 12px;overflow:hidden}.slide{background:var(--paper);width:100%;height:100%;min-height:0;box-sizing:border-box;box-shadow:0 12px 36px rgba(25,37,54,.10);border:1px solid #e2e6eb;border-radius:3px;padding:42px 58px;position:relative;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-size:15px;color:var(--accent);font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:16px}h1{font-size:clamp(36px,4.4vw,60px);line-height:1.16;margin:0 0 22px;letter-spacing:-.03em}.body{white-space:pre-line;font-size:clamp(21px,2.15vw,29px);line-height:1.65;max-width:970px}.note{margin-top:24px;padding:15px 18px;border-left:4px solid var(--accent);background:#f5f8fb;font-size:19px;line-height:1.6;color:#3d4b5d}.count{position:absolute;right:30px;bottom:22px;color:#8892a0;font-size:13px}
.flow{display:flex;flex-direction:column;align-items:center;gap:7px;margin-top:10px}.node{border:1.5px solid #8493a5;border-radius:8px;padding:12px 18px;text-align:center;background:#fff;min-width:190px;font-size:16px}.node small{display:block;color:#657084;margin-top:4px}.node.wide{min-width:620px}.node.accent{border-color:var(--accent);background:var(--accent2)}.arrow{font-size:22px;color:#60738b}.triple,.double{display:flex;gap:16px}.pipeline{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:45px}.pipeline span{padding:16px 17px;border:1.5px solid #8493a5;border-radius:8px;background:#fff;font-weight:700}.pipeline i{font-style:normal;font-size:24px;color:#60738b}.proto{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:35px}.outputs{display:flex;flex-direction:column;gap:10px}
.nav{position:fixed;right:24px;bottom:20px;display:flex;gap:8px;z-index:5}.help{font-size:12px;color:#7b8795}body.presenter header,body.presenter aside,body.presenter .progress,body.presenter .nav{display:none!important}body.presenter main{height:100vh;grid-template-columns:1fr}body.presenter .stage{padding:0;background:#111;overflow:hidden}body.presenter .slide{width:100vw;height:100vh;min-height:100vh;border:0;border-radius:0;box-shadow:none;padding:7vh 8vw}body.presenter h1{font-size:clamp(44px,5.2vw,76px)}body.presenter .body{font-size:clamp(25px,2.5vw,36px);max-width:1200px}body.presenter .note{font-size:22px}body.presenter .eyebrow{font-size:18px}body.presenter .node{font-size:20px;padding:15px 22px}body.presenter .pipeline span{font-size:19px;padding:18px 20px}
@media(max-width:800px){main{grid-template-columns:1fr}aside{display:none}.slide{padding:34px 28px;min-height:78vh}.node.wide{min-width:0;width:100%}.triple,.double,.proto{flex-direction:column}.proto>.arrow{transform:rotate(90deg)}}
@media print{header,aside,.nav,.progress{display:none!important}body{overflow:visible;background:#fff}main{display:block;height:auto}.stage{padding:0;display:block}.slide{box-shadow:none;border:0;width:100%;min-height:100vh;page-break-after:always}}

.note{white-space:pre-line;}

/* Presentation-stage focus */
main{background:linear-gradient(135deg,#edf1f5 0%,#f7f8fa 55%,#e9eef3 100%)}
aside{box-shadow:8px 0 24px rgba(25,37,54,.035);z-index:2}

.stage{position:relative;padding:18px 24px;perspective:1400px}
.stage:before{content:"";position:absolute;inset:8% 6%;background:radial-gradient(ellipse at center,rgba(255,255,255,.95),rgba(255,255,255,0) 68%);filter:blur(16px);pointer-events:none}
.slide{z-index:1;max-width:none;box-shadow:0 26px 70px rgba(25,37,54,.16),0 3px 12px rgba(25,37,54,.07);border:1px solid rgba(210,218,227,.9);border-radius:7px;transform-origin:center center}

body.present main{display:block;height:100vh;background:radial-gradient(ellipse at center,#eef3f8 0%,#dfe6ee 72%,#d7dfe8 100%)}

const DATA={"zh": [{"k": "10/14 回饋修訂報告", "t": "線上購買預測：不同特徵組合的模型效能比較與 SHAP 解釋", "b": "Online Purchase Prediction: Model Performance Comparison across Feature Sets and SHAP Interpretation", "n": "AI 캡스톤프로젝트 2\n指導教授：김문홍 教授\n發表人：ZHAOJIA 조가 (202680224)", "special": ""}, {"k": "教授回饋", "t": "10/14 的兩項回饋與修訂內容", "b": "", "n": "報告順序：回饋 ① → 回饋 ② → 研究計劃書修訂 → 本研究的主張範圍", "special": "<table class=\"tbl\"><tr><th>回饋</th><th>教授標記的位置</th><th>修訂內容</th><th>發表</th></tr><tr><td>① 能否做到實時</td><td>封面的「實時」「基礎研究」，T0·T1·T2 預測時點表</td><td>確認本實驗無法做到實時預測，刪除「實時」，重新定位為離線購買預測研究</td><td>P.3–P.6</td></tr><tr><td>② 具體說明四個問題點</td><td>整張「既有研究的問題點 → 本研究的對應」表</td><td>每個問題以例子與實際數字說明，並一併交代研究限制</td><td>P.7–P.11</td></tr></table>"}, {"k": "回饋 ① 實時", "t": "本實驗既無法進行實時預測，也無法驗證", "b": "", "n": "因此已將「實時」從題目與研究主張中刪除，「基礎研究」的說法也一併整理。", "special": "<div class=\"ba\"><div><b>修訂前</b>基於線上行為資料的實時購買預測模型開發基礎研究</div><i>→</i><div class=\"after\"><b>修訂後</b>線上購買預測：不同特徵組合的模型效能比較與 SHAP 解釋</div></div>"}, {"k": "回饋 ① 用語落差", "t": "計劃書中「實時」的原意與一般含義", "b": "", "n": "例：早上預測當天是否下雨，只能用早上為止的雲量與氣壓，不能用晚上才記錄到的實際降雨量。\n題目與實際進行的內容（以已結束 session 資料進行的離線實驗）不一致，是本人用語不夠精確所致，已於修訂版中更正。", "special": "<table class=\"tbl\"><tr><th>區分</th><th>計劃書中的原意</th><th>一般含義</th></tr><tr><td>所指對象</td><td>於 session 進行中預測的目標（預測時點）</td><td>每次點擊時實際運作預測的系統或實驗</td></tr><tr><td>所需資料</td><td>截至該時點的資訊</td><td>點擊層級的時間紀錄，以及與實際購物網站的連接</td></tr><tr><td>本研究的情形</td><td>僅作為研究目標提出</td><td>未實施，亦無法以本資料實施</td></tr></table>"}, {"k": "回饋 ① 無法實時的理由", "t": "本資料沒有點擊時間（時間戳）", "b": "", "n": "如同購物結束後只拿到收據上的總額，無從得知何時將哪項商品放入購物車。\n因此無法確認「在 session 進行途中，這些數值是否已可取得」。", "special": "<div class=\"big\"><div class=\"kpi\"><b>12,205 筆</b><span>只有 session 結束後彙總的數值（移除 125 筆相同列後）</span></div><div class=\"kpi warn\"><b>無時間戳</b><span>無法驗證各變數的可取得時點</span></div><div class=\"kpi warn\"><b>T2 = 近似</b><span>10/14 版的「每次點擊更新」其實是用 session 結束的彙總值近似</span></div></div>"}, {"k": "回饋 ① 修改內容", "t": "將研究範圍重新定位為離線購買預測", "b": "", "n": "目前的研究：使用已結束的 session 資料，比較放入哪些資訊（A·B·C）與使用哪種模型（LR·RF·XGBoost），如何改變購買預測效能與 SHAP 解釋，是一項應用型模型開發研究。\n實時預測留待取得有點擊時間紀錄的資料後，作為後續研究。", "special": "<div class=\"cards\"><div class=\"card\"><h3>T0·T1·T2 時點表</h3>已刪除。A·B·C 只解讀為<b>輸入資訊的組合</b>，而不是預測時點</div><div class=\"card\"><h3>變數表</h3>17 個預測變數：「未驗證（無時間戳）」<br>Revenue：「不適用（目標標籤）」</div><div class=\"card\"><h3>Prototype</h3>註明「離線研究展示」，不追蹤真實訪客、不連接商店<br><small>離線 = 用已結束的資料訓練與評估</small></div></div>"}, {"k": "回饋 ② 概要", "t": "四個問題點：可能讓結果被高估的風險", "b": "", "n": "研究問題（RQ1–3）是要回答的問題；四個問題點是確保這些答案可信的設計措施。\n各項風險已用研究設計控制，這份資料與方法無法解決的部分則列為研究限制。", "special": "<table class=\"tbl\"><tr><th>問題點</th><th>一句話</th><th>對應 RQ</th></tr><tr><td>1. 預測時點的資訊可用性</td><td>放入預測當下拿不到的資訊，效能會被高估</td><td>RQ2</td></tr><tr><td>2. 過度依賴準確度</td><td>購買者很少時，準確率高也可能找不到買家</td><td>RQ1·RQ2</td></tr><tr><td>3. 評估程序不透明</td><td>評估資料混入訓練或選模，分數會看起來更好</td><td>RQ1</td></tr><tr><td>4. 過度解讀 SHAP</td><td>SHAP 說明模型怎麼算，不是顧客為什麼買</td><td>RQ3</td></tr></table>"}, {"k": "問題 1 預測時點的資訊可用性", "t": "拿掉 PageValues 後，AP 降到一半以下", "b": "", "n": "例子：考試前預測會不會及格，卻把「期末考成績」當作輸入。\n對應：撤回實時主張；以相同程序比較 A（17）、B（排除 PageValues，16）、C（情境變數，8），衡量依賴程度\nXGBoost AP 0.759 → 0.372（差 0.386，95% 區間 [0.334, 0.431]）；B 仍高於 C（0.096 [0.062, 0.134]）\n研究限制：不能只憑分數下降就斷定是資料洩漏；可取得時點需用有時間戳的資料另行驗證", "special": "<img class=\"chart\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABXgAAALGCAIAAABwDm7rAAEAAElEQVR42uyddXQUSff3q7tHMxN3BZKgQQJLcFncJcACgRBYJLg7LK6Lw6IBgiQ4Ce7uLARJCK5x4j7JWPf7x/3R7zwzyRB2WRay93M4nMlMT3V1dXVN3W/dupfiOI4gCIIgCIIgCIIgCIJ8DWhsAgRBEARBEARBEARBvhYoNCAIgiAIgiAIgiAI8tVAoQFBEARBEARBEARBkK8GCg0IgiAIgiAIgiAIgnw1UGhAEARBEARBEARBEOSrgUIDgiAIgiAIgiAIgiBfDRQaEARBEARBEARBEAT5aqDQgCAIgiAIgiAIgiDIVwOFBgRBEARBEARBEARBvhooNCAIgiAIgiAIgiAI8tVAoQFBEARBEARBEARBkK8GCg0IgiAIgiAIgiAIgnw1UGhAEARBEARBEARBEOSrgUIDgiAIgiAIgiAIgiBfDRQaEARBEARBEARBEAT5aqDQgCAIgiAIgiAIgiDIVwOFBgRBEARBEARBEARBvhooNCAIgiAIgiAIgiAI8tVAoQFBEARBEARBEARBkK8GCg0IgiAIgiAIgiAIgnw1UGj4jmBZlmXZ4j7lOO6rnEWr1Wq12r9TgmFNOI77WtVDShOf7RUsy/67PafIs3/n/flfb7Rvc1+MXKbxoRL59h1So9H8nTtipD8b7wkIgiAIgny3UPj7/cNN6Wj635eHOI6jKOo/ZTDDNJphmNJ0UUU+/oYdzMgo8Xe6Qcl70T/a3/5Tnfmfb 各組 AP\">"}, {"k": "問題 2 過度依賴準確度", "t": "全部猜「不買」，準確率也有 84%", "b": "", "n": "例子：100 位客人只有 16 位會買，一律回答「沒人會買」就有 84 分，但一位買家也找不到。\n對應：以 AP 為主要指標（隨機基準 0.156），ROC-AUC、Brier 輔助，並報告各門檻的 Precision、Recall、F1 與混淆矩陣\n研究限制：沒有成本資料，門檻的成本效益未驗證；研究用 0.21 與 Prototype 展示用 0.20 分開報告", "special": "<div class=\"big\"><div class=\"kpi warn\"><b>0.844</b><span>全部預測不購買的 Accuracy（購買比例 15.63%）</span></div><div class=\"kpi warn\"><b>37 / 382</b><span>B 組 XGBoost 門檻 0.50 找到的買家（Recall 0.097）</span></div><div class=\"kpi\"><b>239 / 382</b><span>訓練資料 OOF 選出的門檻 0.21（Recall 0.626，Precision 0.342）</span></div></div>"}, {"k": "問題 3 評估程序不透明", "t": "評估資料沒有用在訓練與選模", "b": "", "n": "例子：事先看過期末考題目的學生，分數無法反映真正實力。\n結果：XGBoost − RF 的 AP 差異 A 0.010 [−0.007, 0.027]、B −0.009 [−0.027, 0.008]，區間都包含 0，分不出誰比較好（也不代表相同）\n研究限制：示範模型選定時曾事後參考評估集 Brier（不作為選模依據）；OOF 非完全巢狀；未做外部資料驗證", "special": "<div class=\"cards\"><div class=\"card\"><h3>資料處理</h3>移除 125 筆相同列 → 12,205 筆<br>分層 8:2（訓練 9,764／評估 2,441，seed 42）</div><div class=\"card\"><h3>只在訓練資料內決定</h3>前處理：只在訓練折內配適<br>超參數：5-fold CV（AP）<br>門檻：訓練資料 OOF 預測</div><div class=\"card\"><h3>差異判斷</h3>1,000 次 bootstrap 95% 區間<br>5 個 seed 檢查切分穩定性</div></div>"}, {"k": "問題 4 過度解讀 SHAP", "t": "輸入組合改變，SHAP 解釋也會改變", "b": "", "n": "例子：模型可以把雨傘銷量當作下雨的線索，但雨傘賣得多不會讓天下雨。\nA：PageValues 平均 |SHAP| 1.867（第一）→ B：ExitRates 0.289 → 0.637（第一），Month 0.826 → 0.362\n對應：區分全域與局部解釋，註明單位為 log-odds（+0.5 ≠ 購買機率增加 50 個百分點）；SHAP 加總誤差 < 0.00001\n研究限制：SHAP 不是因果分析，驗證因果需要另外的實驗設計", "special": "<img class=\"chart\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABXgAAAMICAIAAAD9mxqbAAEAAElEQVR42uzdd1gUV/c48Duzs5Wld0TEgqKCDXtBBMXee429l0RNNLaoUROjxhZ77GJvETsW7IooioIoIKL0In37zPz+OK/z23cpoiF5Tb7nk+fJg8vM7LRd5px777kUz/MEIYQQQgghhBBCqCLQeAoQQgghhBBCCCFUUTDRgBBCCCGEEEIIoQqDiQaEEEIIIYQQQghVGEw0IIQQQgghhBBCqMJgogEhhBBCCCGEEEIVBhMNCCGEEEIIIYQQqjCYaEAIIYQQQgghhFCFwUQDQgghhBBCCCGEKgwmGhBCCCGEEEIIIVRhMNGAEEIIIYQQQgihCoOJBoQQQgghhBBCCFUYTDQghBBCCCGEEEKowmCiASGEEEIIIYQQQhUGEw0IIYQQQgghhBCqMAyegr8fx3EURVEUhacC/T14nuc4Dn6mKIqm6b/hHYW3q8BVhGXKv 據數字）</th><th>不主張的事</th></tr><tr><td class=\"hl\">移除 PageValues 後 AP 大幅下降（0.759 → 0.372）</td><td class=\"hl\">可以做到實時預測</td></tr><tr><td>RF 與 XGBoost 的差異沒有證據（A 0.010、B −0.009）</td><td>XGBoost 是最好的模型</td></tr><tr><td>輸入組合改變，SHAP 解釋也會改變（ExitRates 第一）</td><td>SHAP 顯示了購買的原因</td></tr><tr><td>不能只看 Accuracy（全部不購買也有 0.844）</td><td>PageValues 一定是資料洩漏</td></tr><tr><td>Prototype 與 Python 結果一致（2,441 筆，不一致 0 筆）</td><td>能提高真實商店的營收</td></tr></table>"}, {"k": "結語", "t": "換資訊對效能的影響，遠大於換模型", "b": "① 實時：本資料做不到，已刪除並重新定位為離線研究\n② 四個問題點：以例子、數字與研究限制具體說明，並明示與 RQ 的對應\n③ 核心結果：移除 PageValues 時 AP 差 0.386，模型之間只差約 0.01，無法區分", "n": "後續研究：以有時間戳的資料驗證預測時點 · 以外部資料驗證泛化 · 以成本資料檢討門檻\n\n謝謝聆聽。", "special": ""}], "ko": [{"k": "10/14 피드백 반영 보고", "t": "온라인 구매 예측: 특성 조합에 따른 모델 성능 비교와 SHAP 해석", "b": "Online Purchase Prediction: Model Performance Comparison across Feature Sets and SHAP Interpretation", "n": "AI 캡스톤프로젝트 2\n담당교수: 김문홍 교수님\n발표자: ZHAOJIA 조가 (202680224)", "special": ""}, {"k": "교수님 피드백", "t": "10/14 피드백 두 가지와 반영 내용", "b": "", "n": "보고 순서: 피드백 ① → 피드백 ② → 연구계획서 수정 사항 → 본 연구의 주장 범위", "special": "<table class=\"tbl\"><tr><th>피드백</th><th>교수님께서 표시하신 부분</th><th>반영 내용</th><th>발표</th></tr><tr><td>① 실시간 가능 여부</td><td>표지의 「실시간」「기초연구」, T0·T1·T2 예측 시점 표</td><td>본 실험으로는 실시간 예측이 불가능함을 확인하고 「실시간」을 삭제, 오프라인 구매예측 연구로 범위 재정의</td><td>P.3–P.6</td></tr><tr><td>② 4가지 문제점의 구체적 설명</td><td>「기존 연구의 문제점 → 본 연구의 대응」 표 전체</td><td>각 문제를 예시와 실제 수치로 설명하고 남은 한계를 함께 명시</td><td>P.7–P.11</td></tr></table>"}, {"k": "피드백 ① 실시간", "t": "본 실험으로는 실시간 예측을 할 수도, 검증할 수도 없습니다", "b": "", "n": "따라서 「실시간」을 제목과 연구 주장에서 삭제하였고, 「기초연구」라는 표현도 함께 정리하였습니다.", "special": "<div class=\"ba\"><div><b>수정 전</b>온라인 행동데이터 기반 실시간 구매예측 모형 개발을 위한 기초연구</div><i>→</i><div class=\"after\"><b>수정 후</b>온라인 구매 예측: 특성 조합에 따른 모델 성능 비교와 SHAP 해석</div></div>"}, {"k": "피드백 ① 용어의 차이", "t": "계획서에서 사용한 「실시간」의 본래 의도와 일반적 의미", "b": "", "n": "예: 아침에 그날의 강수 여부를 예측할 때는 아침까지의 구름과 기압만 사용할 수 있으며, 저녁의 실제 강수량은 사용할 수 없습니다.\n제목과 실제 수행 내용(종료된 세션 자료의 오프라인 실험)이 일치하지 않았던 것은 제가 용어를 정확하게 사용하지 못한 데서 비롯되었으며, 수정본에서 바로잡았습니다.", "special": "<table class=\"tbl\"><tr><th>구분</th><th>계획서에서의 본래 의도</th><th>일반적인 의미</th></tr><tr><td>가리키는 것</td><td>세션 도중에 예측한다는 목표(예측 시점)</td><td>클릭할 때마다 예측이 작동하는 시스템·실험</td></tr><tr><td>필요한 자료</td><td>해당 시점까지의 정보</td><td>클릭 단위의 시각 기록, 실제 쇼핑몰과의 연결</td></tr><tr><td>본 연구의 경우</td><td>연구 목표로만 제시함</td><td>수행하지 않았으며, 본 자료로는 수행할 수 없음</td></tr></table>"}, {"k": "피드백 ① 불가능한 이유", "t": "본 자료에는 클릭 시각(타임스탬프)이 없습니다", "b": "", "n": "쇼핑을 마친 뒤 받은 영수증에 합계만 있고, 어떤 상품을 언제 담았는지는 알 수 없는 것과 같습니다.\n따라서 「세션 도중에 이 값을 이미 얻을 수 있었는가」를 확인할 수 없습니다.", "special": "<div class=\"big\"><div class=\"kpi\"><b>12,205건</b><span>세션 종료 후 집계된 값만 존재 (동일 행 125건 제거 후)</span></div><div class=\"kpi warn\"><b>타임스탬프 없음</b><span>각 변수의 가용 시점을 검증할 수 없음</span></div><div class=\"kpi warn\"><b>T2 = 근사</b><span>10/14 제출본의 「클릭마다 갱신」도 세션 종료 합계로 근사한 것</span></div></div>"}, {"k": "피드백 ① 수정 내용", "t": "연구 범위를 오프라인 구매예측으로 재정의", "b": "", "n": "현재 연구: 종료된 세션 자료로 투입 정보(A·B·C)와 모형(LR·RF·XGBoost)에 따라 예측 성능과 SHAP 설명이 어떻게 달라지는지 비교하는 응용형 모형개발 연구\n실시간 예측은 클릭 시각이 기록된 자료를 확보한 뒤의 후속 연구로 남김", "special": "<div class=\"cards\"><div class=\"card\"><h3>T0·T1·T2 시점 표</h3>삭제. A·B·C 조합은 예측 시점이 아니라 <b>입력 정보의 조합</b>으로만 해석</div><div class=\"card\"><h3>변수 표</h3>예측변수 17개: 「검증 불가(타임스탬프 없음)」<br>Revenue: 「해당 없음(목표 라벨)」</div><div class=\"card\"><h3>Prototype</h3>「오프라인 연구용 시연」 명시, 실제 방문자 추적·쇼핑몰 연결 없음<br><small>오프라인 = 종료된 자료로 학습·평가</small></div></div>"}, {"k": "피드백 ② 개요", "t": "4가지 문제점: 결과를 과대평가하게 만들 수 있는 위험", "b": "", "n": "연구문제(RQ1–3)는 답하려는 질문이고, 4가지 문제점은 그 답의 신뢰성을 확보하기 위한 설계상의 장치입니다.\n각 위험은 연구 설계로 통제하였고, 이 자료와 방법으로 해결할 수 없는 부분은 남은 한계로 명시하였습니다.", "special": "<table class=\"tbl\"><tr><th>문제점</th><th>요약</th><th>대응 RQ</th></tr><tr><td>1. 예측 시점의 정보 가용성 미검토</td><td>예측 시점에 얻을 수 없는 정보를 쓰면 성능이 과대평가됨</td><td>RQ2</td></tr><tr><td>2. 정확도에 대한 과도한 의존</td><td>구매자가 적으면 정확도가 높아도 구매자를 찾지 못함</td><td>RQ1·RQ2</td></tr><tr><td>3. 평가 절차의 불투명성</td><td>평가자료가 학습·선택에 관여하면 성능이 높게 나타남</td><td>RQ1</td></tr><tr><td>4. 설명 결과의 과잉 해석</td><td>SHAP은 모형의 계산 방식이지 구매의 원인이 아님</
