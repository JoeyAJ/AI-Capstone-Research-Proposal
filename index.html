<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research Proposal Presentation</title><style>
:root{--bg:#f4f6f8;--paper:#fff;--ink:#172033;--muted:#657084;--line:#dce2e9;--accent:#2f5f96;--accent2:#eaf1f8}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,"Noto Sans KR","Noto Sans TC","Malgun Gothic",Arial,sans-serif;background:var(--bg);color:var(--ink)}

main{height:calc(100vh - 61px);display:grid;grid-template-columns:270px 1fr}aside{background:#fff;border-right:1px solid var(--line);overflow:auto;padding:14px 10px}.toc{display:block;width:100%;text-align:left;margin:4px 0;border:0;border-radius:7px;padding:9px 10px;background:transparent;color:#556174}.toc.active{background:var(--accent2);color:#183d67;font-weight:700}
.stage{display:flex;align-items:center;justify-content:center;padding:28px;overflow:auto}.slide{background:var(--paper);width:min(1120px,95vw);min-height:min(680px,82vh);box-shadow:0 18px 55px rgba(25,37,54,.12);border:1px solid #e2e6eb;border-radius:3px;padding:54px 64px;position:relative;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-size:15px;color:var(--accent);font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:16px}h1{font-size:clamp(30px,4vw,52px);line-height:1.16;margin:0 0 22px;letter-spacing:-.03em}.body{white-space:pre-line;font-size:clamp(18px,2vw,25px);line-height:1.65;max-width:970px}.note{margin-top:24px;padding:15px 18px;border-left:4px solid var(--accent);background:#f5f8fb;font-size:17px;line-height:1.55;color:#3d4b5d}.count{position:absolute;right:30px;bottom:22px;color:#8892a0;font-size:13px}
.flow{display:flex;flex-direction:column;align-items:center;gap:7px;margin-top:10px}.node{border:1.5px solid #8493a5;border-radius:8px;padding:12px 18px;text-align:center;background:#fff;min-width:190px;font-size:16px}.node small{display:block;color:#657084;margin-top:4px}.node.wide{min-width:620px}.node.accent{border-color:var(--accent);background:var(--accent2)}.arrow{font-size:22px;color:#60738b}.triple,.double{display:flex;gap:16px}.pipeline{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:45px}.pipeline span{padding:16px 17px;border:1.5px solid #8493a5;border-radius:8px;background:#fff;font-weight:700}.pipeline i{font-style:normal;font-size:24px;color:#60738b}.proto{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:35px}.outputs{display:flex;flex-direction:column;gap:10px}
.nav{position:fixed;right:24px;bottom:20px;display:flex;gap:8px;z-index:5}.help{font-size:12px;color:#7b8795}body.presenter aside{display:none}body.presenter main{grid-template-columns:1fr}body.presenter header{opacity:.08;transition:.2s}body.presenter header:hover{opacity:1}

@media print{header,aside,.nav,.progress{display:none!important}body{overflow:visible;background:#fff}main{display:block;height:auto}.stage{padding:0;display:block}.slide{box-shadow:none;border:0;width:100%;min-height:100vh;page-break-after:always}}

const DATA={zh:[{"k": "封面", "t": "以線上行為資料為基礎之即時購買預測模型開發基礎研究", "b": "以機器學習比較與 SHAP 可解釋性為中心", "n": "AI Capstone Project 2 · 金文洪（김문홍）教授", "special": ""}, {"k": "研究背景", "t": "為什麼研究購買預測？", "b": "電子商務環境會持續產生頁面瀏覽、停留時間、跳出率、離開率、Page Value 與訪客類型等可觀察行為。這些數位行為痕跡可用來預測購買結果，支援個人化推薦、促銷、顧客應對與行銷資源配置。", "n": "本研究不取代傳統購買意圖研究，而是從消費者行為問題延伸至 AI 行為資料預測。", "special": ""}, {"k": "研究脈絡", "t": "從購買意圖到行為資料預測", "b": "Sheng & Kim (2025)：直播商務中的網紅特性、產品屬性、知覺價值與購買意圖。\n\nSakar et al. (2019)：利用 pageview、session 與使用者資訊進行 real-time purchasing intention prediction。\n\n本研究：保留管理學的購買意圖問題意識，進一步比較 ML 模型、加入 SHAP，並連結 Prediction System Prototype。", "n": "定位：不是發明新演算法，而是「模型開發基礎研究」。", "special": ""}, {"k": "研究目的", "t": "四個核心目的", "b": "① 掌握 session 行為特徵與 Revenue 的分布及關係。\n② 比較 Logistic Regression、Random Forest、XGBoost 的 out-of-sample 預測效能。\n③ 用 Feature Importance 與 SHAP 說明重要特徵及個別預測方向。\n④ 建立輸入行為資訊後可立即呈現購買機率的 Prototype。", "n": "", "special": ""}, {"k": "Real-time 定義", "t": "這裡的「即時」是什麼？", "b": "不是：即時重新訓練模型。\n不是：本研究直接蒐集企業 live clickstream。\n\n是：當可觀察的線上行為資訊輸入後，已訓練模型立即輸出購買機率的 inference 架構。", "n": "歷史 session 資料 → 模型訓練與驗證 → 即時 inference Prototype", "special": ""}, {"k": "研究資料", "t": "UCI Online Shoppers Purchasing Intention Dataset", "b": "12,330 個 sessions · 18 欄\n17 個輸入特徵 + Revenue\n缺失值：0\nRevenue=True：1,908（15.5%）\nRevenue=False：10,422（84.5%）", "n": "存在類別不平衡，因此不能只看 Accuracy。", "special": ""}, {"k": "研究問題", "t": "RQ1–RQ4", "b": "RQ1 行為特徵能在多大程度上預測 Revenue？\nRQ2 LR、RF、XGBoost 的預測效能有何差異？\nRQ3 哪些特徵最重要？對個別預測的貢獻方向為何？\nRQ4 能否建立立即呈現購買機率的 Prediction System Prototype？", "n": "重點是 prediction，不把 H1–H3 擴張成因果假設。", "special": ""}, {"k": "研究模型", "t": "預測導向研究模型", "b": "", "n": "", "special": "<div class=\"flow model\"><div class=\"node wide\"><b>線上行為資料</b><small>網站參與 · 行為指標 · 情境/連線 · 訪客特徵</small></div><div class=\"arrow\">↓</div><div class=\"triple\"><div class=\"node\">Logistic Regression</div><div class=\"node\">Random Forest</div><div class=\"node\">XGBoost</div></div><div class=\"arrow\">↓</div><div class=\"node\"><b>購買結果預測</b><small>Revenue TRUE / FALSE</small></div><div class=\"arrow\">↓</div><div class=\"node\"><b>效能比較與最佳模型</b><small>F1 · ROC-AUC · PR-AUC</small></div><div class=\"arrow\">↓</div><div class=\"double\"><div class=\"node\"><b>SHAP</b><small>預測解釋</small></div><div class=\"node\"><b>購買機率</b><small>即時 inference</small></div></div><div class=\"arrow\">↓</div><div class=\"node accent\"><b>Real-Time Purchase Prediction Prototype</b></div></div>"}, {"k": "研究變數", "t": "17 predictors → Revenue", "b": "網站參與：Administrative / Informational / ProductRelated 及各 Duration\n行為指標：BounceRates / ExitRates / PageValues\n情境、連線與訪客：SpecialDay / Month / OS / Browser / Region / TrafficType / VisitorType / Weekend\n目標：Revenue (TRUE/FALSE)", "n": "PageValues 將特別檢查 prediction-time availability。", "special": ""}, {"k": "研究方法", "t": "模型與評估", "b": "基準模型：Logistic Regression\n比較模型：Random Forest / XGBoost\n資料切分：stratified train/test split\n評估：Accuracy / Precision / Recall / F1 / ROC-AUC / PR-AUC / Confusion Matrix\n機率輸出需要時：Calibration Curve / Brier Score", "n": "調參與不平衡處理只在 training data 內完成，避免 leakage。", "special": ""}, {"k": "研究流程", "t": "從原始資料到 Prototype", "b": "", "n": "", "special": "<div class=\"pipeline\"><span>原始 CSV</span><i>→</i><span>EDA</span><i>→</i><span>Stratified Split</span><i>→</i><span>LR / RF / XGB</span><i>→</i><span>效能評估</span><i>→</i><span>SHAP</span><i>→</i><span>Prototype</span></div>"}, {"k": "SHAP", "t": "AI 為什麼這樣預測？", "b": "SHAP（SHapley Additive exPlanations）用來量化每個特徵對個別預測值提高或降低的貢獻。\n\n本研究要回答：為什麼某個 session 的購買機率被預測得較高或較低？", "n": "SHAP 是解釋層，不是新的預測模型。", "special": ""}, {"k": "Prototype", "t": "Prediction System Prototype", "b": "", "n": "", "special": "<div class=\"proto\"><div class=\"node\"><b>行為資訊輸入</b><small>17 predictors</small></div><div class=\"arrow\">→</div><div class=\"node\"><b>前處理</b><small>同一 pipeline</small></div><div class=\"arrow\">→</div><div class=\"node\"><b>最終模型</b><small>Best validated model</small></div><div class=\"arrow\">→</div><div class=\"outputs\"><div class=\"node accent\"><b>購買機率</b><small>即時輸出</small></div><div class=\"node\"><b>SHAP 說明</b><small>主要貢獻因素</small></div></div></div>"}, {"k": "限制與穩健性", "t": "不過度宣稱 real-time", "b": "① 公開歷史 session 資料 ≠ 企業 live clickstream。\n② real-time 指即時 inference，不是即時 retraining。\n③ 缺少心理、品牌與產品資訊。\n④ 檢查 PageValues 與部分彙整變數的 prediction-time availability。\n⑤ Prototype 是研究用 MVP，不是商用系統。", "n": "可加入「排除 PageValues」模型作為補充分析。", "special": ""}, {"k": "研究貢獻", "t": "本學期完成，為期刊擴展留基礎", "b": "本學期：可重現的公開資料分析 + LR/RF/XGBoost 比較 + SHAP + Prototype。\n\n未來投稿：最新／外部資料驗證、時間序列或部分 session 資料、calibration、穩健性分析、真實部署環境評估。", "n": "管理學問題 → AI 預測 → XAI 解釋 → 系統 Prototype", "special": ""}, {"k": "結論", "t": "研究定位", "b": "本研究以線上消費者行為與購買意圖為問題起點，使用公開行為資料比較三種機器學習模型，透過 SHAP 提供可解釋性，並將最佳模型連結至即時購買機率 Prototype。", "n": "核心：Real-time purchase prediction model development 的基礎研究。", "special": ""}],ko:[{"k": "표지", "t": "온라인 행동데이터 기반 실시간 구매예측 모형 개발을 위한 기초연구", "b": "머신러닝 비교 및 SHAP 기반 설명가능성을 중심으로", "n": "AI 캡스톤프로젝트 2 · 김문홍 교수", "special": ""}, {"k": "연구배경", "t": "왜 구매예측을 연구하는가?", "b": "전자상거래 환경에서는 페이지 방문 수, 체류시간, 이탈률, 종료율, Page Value, 방문자 유형 등 관찰 가능한 행동정보가 지속적으로 생성된다. 이러한 디지털 행동흔적은 구매결과를 예측하고 개인화 추천, 프로모션, 고객 대응 및 마케팅 자원배분에 활용될 수 있다.", "n": "본 연구는 기존 구매의도 연구를 대체하는 것이 아니라 소비자행동 문제를 AI 행동데이터 예측으로 확장한다.", "special": ""}, {"k": "연구맥락", "t": "구매의도에서 행동데이터 예측으로", "b": "Sheng & Kim (2025): 라이브커머스에서 인플루언서 특성, 제품속성, 지각된 가치와 구매의도.\n\nSakar et al. (2019): pageview, session, 사용자 정보를 이용한 real-time purchasing intention prediction.\n\n본 연구: 경영학적 구매의도 문제의식을 유지하면서 ML 비교, SHAP, Prediction System Prototype으로 확장.", "n": "연구 성격: 새로운 알고리즘 발명이 아니라 「모형개발 기초연구」.", "special": ""}, {"k": "연구목적", "t": "네 가지 핵심 목적", "b": "① 세션 행동특성과 Revenue의 분포 및 관계 파악.\n② Logistic Regression, Random Forest, XGBoost의 out-of-sample 예측성능 비교.\n③ Feature Importance와 SHAP으로 중요 특성과 개별 예측의 기여방향 설명.\n④ 행동정보 입력 시 구매확률을 즉시 제시하는 Prototype 구현.", "n": "", "special": ""}, {"k": "Real-time 정의", "t": "본 연구에서 「실시간」의 의미", "b": "아님: 실시간으로 모형을 계속 재학습.\n아님: 기업 live clickstream을 직접 수집.\n\n의미: 관찰 가능한 온라인 행동정보가 입력되면 학습된 모형이 구매확률을 즉시 산출하는 inference 구조.", "n": "과거 session 자료 → 모형 학습·검증 → 실시간 inference Prototype", "special": ""}, {"k": "연구자료", "t": "UCI Online Shoppers Purchasing Intention Dataset", "b": "12,330 sessions · 18 columns\n17개 입력특성 + Revenue\n결측치: 0\nRevenue=True: 1,908 (15.5%)\nRevenue=False: 10,422 (84.5%)", "n": "클래스 불균형이 있으므로 Accuracy만으로 평가하지 않는다.", "special": ""}, {"k": "연구문제", "t": "RQ1–RQ4", "b": "RQ1 행동특성은 Revenue를 어느 정도 예측할 수 있는가?\nRQ2 LR, RF, XGBoost 간 예측성능 차이는?\nRQ3 가장 중요한 특성과 개별 예측 기여방향은?\nRQ4 구매확률을 즉시 제시하는 Prediction System Prototype을 구성할 수 있는가?", "n": "예측 중심 연구이며 H1–H3를 인과가설로 확대해석하지 않는다.", "special": ""}, {"k": "연구모형", "t": "예측 중심 연구모형", "b": "", "n": "", "special": "<div class=\"flow model\"><div class=\"node wide\"><b>온라인 행동데이터</b><small>웹사이트 참여 · 행동지표 · 상황/접속 · 방문자 특성</small></div><div class=\"arrow\">↓</div><div class=\"triple\"><div class=\"node\">Logistic Regression</div><div class=\"node\">Random Forest</div><div class=\"node\">XGBoost</div></div><div class=\"arrow\">↓</div><div class=\"node\"><b>구매결과 예측</b><small>Revenue TRUE / FALSE</small></div><div class=\"arrow\">↓</div><div class=\"node\"><b>성능비교 및 최종모형</b><small>F1 · ROC-AUC · PR-AUC</small></div><div class=\"arrow\">↓</div><div class=\"double\"><div class=\"node\"><b>SHAP</b><small>예측 설명</small></div><div class=\"node\"><b>구매확률</b><small>즉시 inference</small></div></div><div class=\"arrow\">↓</div><div class=\"node accent\"><b>Real-Time Purchase Prediction Prototype</b></div></div>"}, {"k": "연구변수", "t": "17 predictors → Revenue", "b": "웹사이트 참여: Administrative / Informational / ProductRelated 및 각 Duration\n행동지표: BounceRates / ExitRates / PageValues\n상황·접속·방문자: SpecialDay / Month / OS / Browser / Region / TrafficType / VisitorType / Weekend\n목표변수: Revenue (TRUE/FALSE)", "n": "PageValues는 prediction-time availability를 별도로 검토한다.", "special": ""}, {"k": "연구방법", "t": "모형과 평가체계", "b": "기준모형: Logistic Regression\n비교모형: Random Forest / XGBoost\n데이터 분할: stratified train/test split\n평가: Accuracy / Precision / Recall / F1 / ROC-AUC / PR-AUC / Confusion Matrix\n확률 신뢰성이 중요할 경우: Calibration Curve / Brier Score", "n": "튜닝과 불균형 대응은 training data 내부에서만 수행하여 leakage를 방지한다.", "special": ""}, {"k": "연구절차", "t": "원자료에서 Prototype까지", "b": "", "n": "", "special": "<div class=\"pipeline\"><span>원본 CSV</span><i>→</i><span>EDA</span><i>→</i><span>Stratified Split</span><i>→</i><span>LR / RF / XGB</span><i>→</i><span>성능평가</span><i>→</i><span>SHAP</span><i>→</i><span>Prototype</span></div>"}, {"k": "SHAP", "t": "AI가 왜 이렇게 예측했는가?", "b": "SHAP(SHapley Additive exPlanations)은 각 특성이 개별 예측값을 높이거나 낮추는 데 얼마나 기여했는지를 정량화한다.\n\n본 연구의 질문: 왜 이 session의 구매확률이 높거나 낮게 예측되었는가?", "n": "SHAP은 설명계층이며 새로운 예측모형이 아니다.", "special": ""}, {"k": "Prototype", "t": "Prediction System Prototype", "b": "", "n": "", "special": "<div class=\"proto\"><div class=\"node\"><b>행동정보 입력</b><small>17 predictors</small></div><div class=\"arrow\">→</div><div class=\"node\"><b>전처리</b><small>同一 pipeline</small></div><div class=\"arrow\">→</div><div class=\"node\"><b>최종모형</b><small>Best validated model</small></div><div class=\"arrow\">→</div><div class=\"outputs\"><div class=\"node accent\"><b>구매확률</b><small>즉시 출력</small></div><div class=\"node\"><b>SHAP 설명</b><small>주요 기여요인</small></div></div></div>"}, {"k": "한계 및 강건성", "t": "Real-time을 과장하지 않는다", "b": "① 공개 과거 session 자료 ≠ 기업 live clickstream.\n② real-time은 즉시 inference이며 실시간 retraining이 아니다.\n③ 심리·브랜드·제품정보가 포함되지 않는다.\n④ PageValues와 일부 집계변수의 prediction-time availability를 확인한다.\n⑤ Prototype은 연구용 MVP이며 상용시스템이 아니다.", "n": "필요 시 PageValues 제외 모형을 보조분석으로 비교한다.", "special": ""}, {"k": "연구기여", "t": "이번 학기 완성 + 향후 학술지 확장", "b": "이번 학기: 재현 가능한 공개자료 분석 + LR/RF/XGBoost 비교 + SHAP + Prototype.\n\n향후 투고: 최신·외부자료 검증, 시간순/부분 session 자료, calibration, 강건성 분석, 실제 배포환경 평가.", "n": "경영학 문제 → AI 예측 → XAI 설명 → 시스템 Prototype", "special": ""}, {"k": "결론", "t": "연구의 최종 위치", "b": "온라인 소비자행동과 구매의도를 문제의 출발점으로 하여 공개 행동데이터에서 세 가지 머신러닝 모형을 비교하고, SHAP으로 설명가능성을 확보한 뒤 최종모형을 실시간 구매확률 Prototype으로 연결한다.", "n": "핵심: Real-time purchase prediction model development를 위한 기초연구.", "special": ""}]}; let lang=localStorage.getItem('lang')||'ko'; let idx=0;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function render(){const s=DATA[lang][idx];document.documentElement.lang=lang==='ko'?'ko':'zh-Hant';document.getElementById('slide').innerHTML=`<div class="eyebrow">${esc(s.k)}</div><h1>${esc(s.t)}</h1>${s.b?`<div class="body">${esc(s.b)}</div>`:''}${s.special||''}${s.n?`<div class="note">${esc(s.n)}</div>`:''}<div class="count">${idx+1} / ${DATA[lang].length}</div>`;document.querySelector('.bar').style.width=((idx+1)/DATA[lang].length*100)+'%';document.querySelectorAll('.toc').forEach((x,i)=>x.classList.toggle('active',i===idx));document.getElementById('zh').classList.toggle('active',lang==='zh');document.getElementById('ko').classList.toggle('active',lang==='ko');}
function toc(){let el=document.getElementById('toc');el.innerHTML='';DATA[lang].forEach((s,i)=>{let b=document.createElement('button');b.className='toc';b.textContent=(i+1)+'. '+s.k;b.onclick=()=>{idx=i;render()};el.appendChild(b)});render()}
function move(d){idx=Math.max(0,Math.min(DATA[lang].length-1,idx+d));render()};
document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.getElementById('zh').onclick=()=>{lang='zh';localStorage.setItem('lang',lang);idx=0;toc()};document.getElementById('ko').onclick=()=>{lang='ko';localStorage.setItem('lang',lang);idx=0;toc()};document.getElementById('present').onclick=()=>document.body.classList.toggle('present');document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();document.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();move(1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();move(-1)}if(e.key==='Home'){idx=0;render()}if(e.key==='End'){idx=DATA[lang].length-1;render()}});toc();
