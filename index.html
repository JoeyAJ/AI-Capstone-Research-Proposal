<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>即時購買預測模型開發基礎研究 · 發表</title><style>
:root{--bg:#f4f6f8;--paper:#fff;--ink:#172033;--muted:#657084;--line:#dce2e9;--accent:#2f5f96;--accent2:#eaf1f8}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,"Noto Sans KR","Noto Sans TC","Malgun Gothic",Arial,sans-serif;background:var(--bg);color:var(--ink)}
body{overflow:hidden}header{height:58px;display:flex;align-items:center;gap:12px;padding:0 22px;background:#fff;border-bottom:1px solid var(--line)}
.brand{font-weight:750;letter-spacing:.02em;margin-right:auto}button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;font-size:14px;cursor:pointer;color:var(--ink)}button:hover,button.active{background:var(--accent2);border-color:#b9cbe0}.progress{height:3px;background:#dce2e9}.bar{height:100%;background:var(--accent);width:0;transition:.2s}
main{height:calc(100vh - 61px);display:grid;grid-template-columns:205px 1fr}aside{background:#fff;border-right:1px solid var(--line);overflow:auto;padding:10px 7px}.toc{display:block;width:100%;text-align:left;margin:4px 0;border:0;border-radius:7px;padding:7px 8px;background:transparent;color:#556174;font-size:12px;line-height:1.25}.toc.active{background:var(--accent2);color:#183d67;font-weight:700}
.stage{display:flex;align-items:stretch;justify-content:stretch;padding:10px 12px;overflow:hidden}.slide{background:var(--paper);width:100%;height:100%;min-height:0;box-sizing:border-box;box-shadow:0 12px 36px rgba(25,37,54,.10);border:1px solid #e2e6eb;border-radius:3px;padding:42px 58px;position:relative;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-size:15px;color:var(--accent);font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:16px}h1{font-size:clamp(36px,4.4vw,60px);line-height:1.16;margin:0 0 22px;letter-spacing:-.03em}.body{white-space:pre-line;font-size:clamp(21px,2.15vw,29px);line-height:1.65;max-width:970px}.note{margin-top:24px;padding:15px 18px;border-left:4px solid var(--accent);background:#f5f8fb;font-size:19px;line-height:1.6;color:#3d4b5d}.count{position:absolute;right:30px;bottom:22px;color:#8892a0;font-size:13px}
.flow{display:flex;flex-direction:column;align-items:center;gap:7px;margin-top:10px}.node{border:1.5px solid #8493a5;border-radius:8px;padding:12px 18px;text-align:center;background:#fff;min-width:190px;font-size:16px}.node small{display:block;color:#657084;margin-top:4px}.node.wide{min-width:620px}.node.accent{border-color:var(--accent);background:var(--accent2)}.arrow{font-size:22px;color:#60738b}.triple,.double{display:flex;gap:16px}.pipeline{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:45px}.pipeline span{padding:16px 17px;border:1.5px solid #8493a5;border-radius:8px;background:#fff;font-weight:700}.pipeline i{font-style:normal;font-size:24px;color:#60738b}.proto{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:35px}.outputs{display:flex;flex-direction:column;gap:10px}
.nav{position:fixed;right:24px;bottom:20px;display:flex;gap:8px;z-index:5}.help{font-size:12px;color:#7b8795}body.presenter header,body.presenter aside,body.presenter .progress,body.presenter .nav{display:none!important}body.presenter main{height:100vh;grid-template-columns:1fr}body.presenter .stage{padding:0;background:#111;overflow:hidden}body.presenter .slide{width:100vw;height:100vh;min-height:100vh;border:0;border-radius:0;box-shadow:none;padding:7vh 8vw}body.presenter h1{font-size:clamp(44px,5.2vw,76px)}body.presenter .body{font-size:clamp(25px,2.5vw,36px);max-width:1200px}body.presenter .note{font-size:22px}body.presenter .eyebrow{font-size:18px}body.presenter .node{font-size:20px;padding:15px 22px}body.presenter .pipeline span{font-size:19px;padding:18px 20px}
@media(max-width:800px){main{grid-template-columns:1fr}aside{display:none}.slide{padding:34px 28px;min-height:78vh}.node.wide{min-width:0;width:100%}.triple,.double,.proto{flex-direction:column}.proto>.arrow{transform:rotate(90deg)}}
@media print{header,aside,.nav,.progress{display:none!important}body{overflow:visible;background:#fff}main{display:block;height:auto}.stage{padding:0;display:block}.slide{box-shadow:none;border:0;width:100%;min-height:100vh;page-break-after:always}}

.note{white-space:pre-line;}

/* Presentation-stage focus */
main{background:linear-gradient(135deg,#edf1f5 0%,#f7f8fa 55%,#e9eef3 100%)}
aside{box-shadow:8px 0 24px rgba(25,37,54,.035);z-index:2}
.toc{transition:opacity .18s ease,background .18s ease,color .18s ease,transform .18s ease;opacity:.58}
.toc.active{opacity:1;transform:translateX(2px);box-shadow:inset 3px 0 0 var(--accent)}
.stage{position:relative;padding:18px 24px;perspective:1400px}
.stage:before{content:"";position:absolute;inset:8% 6%;background:radial-gradient(ellipse at center,rgba(255,255,255,.95),rgba(255,255,255,0) 68%);filter:blur(16px);pointer-events:none}
.slide{z-index:1;max-width:none;box-shadow:0 26px 70px rgba(25,37,54,.16),0 3px 12px rgba(25,37,54,.07);border:1px solid rgba(210,218,227,.9);border-radius:7px;transform-origin:center center}
.slide.page-enter{animation:pageFocus .26s cubic-bezier(.2,.75,.25,1)}
@keyframes pageFocus{0%{opacity:.3;transform:translateY(10px) scale(.988)}100%{opacity:1;transform:translateY(0) scale(1)}}
body.present main{display:block;height:100vh;background:radial-gradient(ellipse at center,#eef3f8 0%,#dfe6ee 72%,#d7dfe8 100%)}
body.present header,body.present .progress,body.present aside,body.present .nav{display:none!important}
body.present .stage{height:100vh;width:100vw;padding:2.2vh 2.2vw;display:flex;align-items:stretch;justify-content:stretch}
body.present .stage:before{inset:3% 3%;filter:blur(24px)}
body.present .slide{width:100%;height:100%;padding:5vh 6vw;border-radius:10px;box-shadow:0 34px 100px rgba(18,31,48,.24),0 5px 18px rgba(18,31,48,.10)}
body.present .eyebrow{font-size:clamp(16px,1.25vw,22px)}
body.present h1{font-size:clamp(44px,4.8vw,78px)}
body.present .body{font-size:clamp(21px,1.8vw,30px);line-height:1.62}
body.present .note{font-size:clamp(18px,1.45vw,25px)}
body.present .node,body.present .pipeline span{font-size:clamp(16px,1.2vw,22px)}
body.present .count{font-size:16px}

.tbl{border-collapse:collapse;width:100%;max-width:1100px;margin-top:8px;font-size:clamp(14px,1.25vw,19px);line-height:1.45}
.tbl th,.tbl td{border:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
.tbl th{background:var(--accent2);color:#183d67;font-weight:700}
.tbl td.hl{background:#fff7e6;font-weight:700}
.chart{display:block;max-width:100%;max-height:58vh;margin:4px auto 0;object-fit:contain}
.big{display:flex;gap:22px;margin-top:10px;flex-wrap:wrap}
.kpi{flex:1;min-width:200px;border:1.5px solid var(--line);border-radius:10px;padding:18px 20px;background:#fff}
.kpi b{display:block;font-size:clamp(30px,3.4vw,52px);color:var(--accent);letter-spacing:-.02em}
.kpi span{font-size:clamp(14px,1.2vw,18px);color:var(--muted)}
.kpi.warn b{color:#b5532b}
body.present .tbl{font-size:clamp(15px,1.3vw,21px)}
</style></head><body><header><div class="brand">AI Capstone · Research Proposal</div><button id="zh">繁中</button><button id="ko">한국어</button><button id="present">演講模式</button><button id="full">全螢幕</button><span class="help">← → / Space</span></header><div class="progress"><div class="bar"></div></div><main><aside id="toc"></aside><section class="stage"><article class="slide" id="slide"></article></section></main><div class="nav"><button id="prev">←</button><button id="next">→</button></div><script>
const DATA={"zh": [{"k": "封面", "t": "以線上行為資料為基礎之即時購買預測模型開發基礎研究", "b": "以機器學習比較與 SHAP 可解釋性為中心", "n": "AI 캡스톤프로젝트 2\n指導教授：김문홍 교수\n發表人：ZHAOJIA 조가 (202680224)", "special": ""}, {"k": "研究背景", "t": "大多數訪客最後都沒有買", "b": "本研究資料中，只有約 15.5% 的購物會話最後完成購買。\n\n如果能在訪客離開之前，先估計「他會不會買」，網站就能及時提供推薦、優惠或客服。", "n": "問題：我們能用訪客在網站上的行為，提前預測購買嗎？", "special": ""}, {"k": "本版修訂", "t": "依 10/7 教授回饋修訂", "b": "", "n": "", "special": "<table class=\"tbl\"><tr><th>教授回饋</th><th>本版對應</th></tr><tr><td class=\"\">先行研究：購買預測模型</td><td class=\"\">P.4 先行研究</td></tr><tr><td class=\"\">SHAP：定義與應用現況</td><td class=\"\">P.9 SHAP</td></tr><tr><td class=\"\">既有研究的問題點</td><td class=\"\">P.5 問題點</td></tr><tr><td class=\"\">模型開發</td><td class=\"\">P.7–P.15 方法、結果、Prototype</td></tr></table>"}, {"k": "先行研究", "t": "別人已經做了什麼？", "b": "Sakar et al. (2019)：用同一份資料提出即時購物行為分析系統。\n\n之後的研究（2022–2026）：比較 XGBoost、Random Forest 等模型，近年也開始用 SHAP 解釋。", "n": "本研究不發明新演算法，而是先確認「即時情境下哪些資料真的能用」。", "special": ""}, {"k": "問題點", "t": "一個變數幾乎決定了答案", "b": "", "n": "PageValues 的計算和交易金額有關，但資料沒有說明它何時算出來。如果即時情境下拿不到它，高分就不能直接用在即時系統。", "special": "<div class=\"big\"><div class=\"kpi\"><b>56.3%</b><span>PageValues > 0 的會話購買率</span></div><div class=\"kpi warn\"><b>3.9%</b><span>PageValues = 0 的會話購買率</span></div><div class=\"kpi warn\"><b>84%</b><span>全部猜「不買」也能拿到的準確率</span></div></div>"}, {"k": "「即時」定義", "t": "我們說的「即時」是哪個時間點？", "b": "", "n": "本研究是使用完整會話資料的「離線實驗」：先確認可用變數與候選模型，真正的即時表現之後再用逐點擊資料驗證。", "special": "<table class=\"tbl\"><tr><th>時點</th><th>當下能拿到的資訊</th><th>對應設定</th><th>本資料能驗證嗎？</th></tr><tr><td class=\"\">T0 進站時</td><td class=\"\">月份、裝置、地區、流量來源、訪客類型</td><td class=\"\">C</td><td class=\"\">大致可以</td></tr><tr><td class=\"\">T1 看完第一個商品頁</td><td class=\"\">T0 + 最初幾頁的瀏覽紀錄</td><td class=\"\">無</td><td class=\"\">不能</td></tr><tr><td class=\"\">T2 每次點擊後更新</td><td class=\"\">T0 + 累積頁數、停留時間、離開率</td><td class=\"\">B（近似）</td><td class=\"\">不能直接驗證：只是上限參考</td></tr></table>"}, {"k": "研究資料", "t": "資料與三種比較設定", "b": "UCI Online Shoppers Purchasing Intention Dataset\n  "例：機率最高的會話（0.729）停留約 96 分鐘、看了 70 個商品頁，但實際上沒有買。高機率不等於一定購買。", "special": "<table class=\"tbl\"><tr><th>變數</th><th>影響方向</th></tr><tr><td class=\"\">ExitRates（離開率）</td><td class=\"\">越高 → 越不會買</td></tr><tr><td class=\"\">商品頁停留時間</td><td class=\"\">越久 → 越可能買</td></tr><tr><td class=\"\">管理類頁面（帳號、結帳）</td><td class=\"\">看越多 → 越可能買</td></tr><tr><td class=\"\">月份</td><td class=\"\">11 月、10 月較高；2 月、3 月較低</td></tr></table>"}, {"k": "Prototype", "t": "Prediction System Prototype", "b": "", "n": "模型選擇：RF 和 XGBoost 預測表現分不出來（RF 數值略高）。暫選 XGBoost 作展示候選，因為 Recall 略好，也能和 A 設定比較 SHAP。最終模型之後用事先固定的規則決定。", "special": "<div class=\"proto\"><div class=\"node\"><b>輸入行為資訊</b><small>16 個變數</small></div><div class=\"arrow\">→</div><div class=\"node\"><b>前處理</b><small>同一 pipeline</small></div><div class=\"arrow\">→</div><div class=\"node\"><b>B 設定模型</b><small>暫定 XGBoost</small></div><div class=\"arrow\">→</div><div class=\"outputs\"><div class=\"node accent\"><b>購買機率</b><small>0–1</small></div><div class=\"node\"><b>SHAP 說明</b><small>前 5 個因素</small></div></div></div>"}, {"k": "完成程度", "t": "現在做到哪裡？", "b": "", "n": "目前交付：離線實驗結果＋Prototype 設計與預測核心。不是已驗證的即時系統。", "special": "<table class=\"tbl\"><tr><th>項目</th><th>設計</th><th>實作</th><th>驗證</th></tr><tr><td class=\"\">資料處理與三種模型</td><td class=\"\">完成</td><td class=\"\">完成</td><td class=\"\">離線驗證完成</td></tr><tr><td class=\"\">SHAP 解釋</td><td class=\"\">完成</td><td class=\"\">完成</td><td class=\"\">加總性已驗證</td></tr><tr><td class=\"\">Prototype 預測核心</td><td class=\"\">完成</td><td class=\"\">模型已存檔</td><td class=\"\">未驗證</td></tr><tr><td class=\"\">Prototype 介面</td><td class=\"\">完成</td><td class=\"\">未實作</td><td class=\"\">未驗證</td></tr><tr><td class=\"\">即時部署</td><td class=\"\">不在範圍</td><td class=\"\">—</td><td class=\"\">—</td></tr></table>"}, {"k": "研究貢獻", "t": "和既有研究比，多了什麼？", "b": "", "n": "每一項都對應本研究算出的數字，可用同一資料與相同隨機種子重現。", "special": "<table class=\"tbl\"><tr><th>貢獻</th><th>可核實的結果</th></tr><tr><td class=\"\">量化 PageValues 的影響</td><td class=\"\">PR-AUC 0.756 → 0.376，差 0.380</td></tr><tr><td class=\"\">把「即時」拆成可檢驗的時點</td><td class=\"\">T0 約 0.28（隨機基準 0.156）</td></tr><tr><td class=\"\">用區間判斷模型差異</td><td class=\"\">XGBoost 與 RF 無法區分</td></tr><tr><td class=\"\">檢查 SHAP 隨資訊改變</td><td class=\"\">ExitRates 由 0.289 升至 0.635</td></tr><tr><td class=\"\">不只看準確率</td><td class=\"\">準確率 0.84 = 全猜不買</td></tr></table>"}, {"k": "限制與下一步", "t": "接下來要做什麼？", "b": "① 明確定義即時應用情境：選定 T0／T1／T2，用逐點擊資料驗證。\n② 強化模型選擇依據：事先固定規則，調整門檻後再定最終模型。\n③ 完成 Prototype 介面，並逐筆比對輸出。\n④ 補充機率校準與門檻比較。", "n": "限制：資料只有會話結束值、沒有使用者 ID 與時間；SHAP 不是因果。", "special": ""}, {"k": "結論", "t": "一句話總結", "b": "在完整會話的離線資料中，PageValues 是決定預測表現的關鍵。\n拿掉它之後，RF 與 XGBoost 表現相當，行為資料仍有預測力。\n\n下一步是用逐點擊資料，驗證真正的即時預測。", "n": "謝謝聆聽。", "special": ""}], "ko": [{"k": "표지", "t": "온라인 행동데이터 기반 실시간 구매예측 모형 개발을 위한 기초연구", "b": "머신러닝 비교 및 SHAP 기반 설명가능성을 중심으로", "n": "AI 캡스톤프로젝트 2\n담당교수: 김문홍 교수\n발표자: ZHAOJIA 조가 (202680224)", "special": ""}, {"k": "연구배경", "t": "대부분의 방문자는 결국 구매하지 않는다", "b": "본 연구 자료에서 구매로 끝난 세션은 약 15.5%뿐이다.\n\n방문자가 떠나기 전에 「살지 안 살지」를 미리 알 수 있다면, 추천·할인·상담을 제때 제공할 수 있다.", "n": "질문: 사이트 안의 행동으로 구매를 미리 예측할 수 있을까?", "special": ""}, {"k": "수정 사항", "t": "10/7 교수님 피드백 반영", "b": "", "n": "", "special": "<table class=\"tbl\"><tr><th>교수님 피드백</th><th>반영 위치</th></tr><tr><td class=\"\">선행연구: 구매예측 모형</td><td class=\"\">P.4 선행연구</td></tr><tr><td class=\"\">SHAP: 정의, 활용 현황</td><td class=\"\">P.9 SHAP</td></tr><tr><td class=\"\">기존 연구의 문제점</td><td class=\"\">P.5 문제점</td></tr><tr><td class=\"\">모형 개발</td><td class=\"\">P.7–P.15 방법, 결과, Prototype</td></tr></table>"}, {"k": "선행연구", "t": "기존 연구는 무엇을 했나?", "b": "Sakar et al. (2019): 같은 자료로 실시간 쇼핑 행동분석 시스템 제안.\n\n이후 연구(2022–2026): XGBoost, Random Forest 등 모형 비교, 최근에는 SHAP으로 설명.", "n": "본 연구는 새 알고리즘이 아니라, 「실시간 상황에서 어떤 자료를 실제로 쓸 수 있는가」를 먼저 확인한다.", "special": ""}, {"k": "문제점", "t": "변수 하나가 답을 거의 결정한다", "b": "", "n": "PageValues는 거래 금액과 관련되어 계산되지만, 언제 계산되는지 자료에 설명이 없다. 실시간에 이 값을 쓸 수 없다면, 높은 점수를 실시간 시스템에 그대로 적용할 수 없다.", "special": "<div class=\"big\"><div class=\"kpi\"><b>56.3%</b><span>PageValues > 0 세션의 구매율</span></div><div class=\"kpi warn\"><b>3.9%</b><span>PageValues = 0 세션의 구매율</span></div><div class=\"kpi warn\"><b>84%</b><span>모두 「비구매」로 찍어도 나오는 정확도</span></div></div>"}, {"k": "「실시간」 정의", "t": "「실시간」은 어느 시점인가?", "b": "", "n": "본 연구는 완전한 세션 자료를 쓴 「오프라인 실험」이다. 사용 가능한 변수와 후보 모형을 먼저 정하고, 실제 실시간 성능은 클릭 단위 자료로 추후 검증한다.", "special": "<table class=\"tbl\"><tr><th>시점</th><th>그때 알 수 있는 정보</th><th>대응 설정</th><th>본 자료로 검증?</th></tr><tr><td class=\"\">T0 방문 직후</td><td class=\"\">월, 기기, 지역, 유입 경로, 방문자 유형</td><td class=\"\">C</td><td class=\"\">대체로 가능</td></tr><tr><td class=\"\">T1 첫 상품 페이지 후</td><td class=\"\">T0 + 초기 몇 페이지 기록</td><td class=\"\">없음</td><td class=\"\">불가</td></tr><tr><td class=\"\">T2 클릭마다 갱신</td><td class=\"\">T0 + 누적 페이지 수, 체류시간, 종료율</td><td class=\"\">B(근사)</td><td class=\"\">직접 검증 불가: 상한 참고치</td></tr></table>"}, {"k": "연구자료", "t": "자료와 세 가지 비교 설정", "b": "UCI Online Shoppers Purchasing Intention Dataset\n12,330 세션, 중복 125건 제거 후 12,205건, 구매 15.6%", "n": "", "special": "<table class=\"tbl\"><tr><th>설정</th><th>사용 변수</th><th>의미</th></tr><tr><td class=\"\">A 전체 변수</td><td class=\"\">17개</td><td class=\"\">기존 연구와 같은 기준</td></tr><tr><td class=\"\">B PageValues 제외</td><td class=\"\">16개</td><td class=\"\">실시간 적용 후보</td></tr><tr><td class=\"\">C 상황 변수만</td><td class=\"\">8개</td><td class=\"\">방문 직후 알 수 있는 정보</td></tr></table>"}, {"k": "연구방법", "t": "어떻게 비교했나?", "b": "", "n": "튜닝은 학습자료 안에서만 하고 평가자료는 건드리지 않아 점수 부풀림을 막았다.", "special": "<div class=\"pipeline\"><span>원자료</span><i>→</i><span>중복 제거</span><i>→</i><span>8:2 분할</span><i>→</i><span>LR / RF / XGBoost</span><i>→</i><span>PR-AUC 평가</span><i>→</i><span>SHAP 설명</span><i>→</i><span>Prototype</span></div>"}, {"k": "SHAP", "t": "SHAP: AI는 왜 이렇게 판단했나?", "b": "SHAP은 하나의 예측을 「기준값 + 각 변수의 기여」로 나눈다.\n\n양수 → 이 세션을 「구매」 쪽으로 민다\n음수 → 「비구매」 쪽으로 민다", "n": "SHAP은 「모형이 변수를 어떻게 쓰는가」를 보여줄 뿐, 인과관계는 아니다.", "special": ""}, {"k": "결과 1", "t": "PageValues를 빼면 점수가 절반으로", "b": "", "n": "세 모형 모두 0.32~0.38 하락. GBoost</small></div><div class=\"arrow\">→</div><div class=\"outputs\"><div class=\"node accent\"><b>구매확률</b><small>0–1</small></div><div class=\"node\"><b>SHAP 설명</b><small>상위 5개 요인</small></div></div></div>"}, {"k": "완성 단계", "t": "지금 어디까지 했나?", "b": "", "n": "현재 결과물: 오프라인 실험 결과 + Prototype 설계와 예측 핵심부. 검증된 실시간 시스템은 아니다.", "special": "<table class=\"tbl\"><tr><th>항목</th><th>설계</th><th>구현</th><th>검증</th></tr><tr><td class=\"\">자료 처리와 세 모형</td><td class=\"\">완료</td><td class=\"\">완료</td><td class=\"\">오프라인 검증 완료</td></tr><tr><td class=\"\">SHAP 설명</td><td class=\"\">완료</td><td class=\"\">완료</td><td class=\"\">가법성 검증 완료</td></tr><tr><td class=\"\">Prototype 예측 핵심부</td><td class=\"\">완료</td><td class=\"\">모형 저장 완료</td><td class=\"\">미검증</td></tr><tr><td class=\"\">Prototype 인터페이스</td><td class=\"\">완료</td><td class=\"\">미구현</td><td class=\"\">미검증</td></tr><tr><td class=\"\">실시간 배포</td><td class=\"\">범위 밖</td><td class=\"\">—</td><td class=\"\">—</td></tr></table>"}, {"k": "연구 기여", "t": "기존 연구보다 무엇이 더해졌나?", "b": "", "n": "모든 항목은 본 연구가 계산한 숫자에 대응하며, 같은 자료와 같은 random seed로 재현할 수 있다.", "special": "<table class=\"tbl\"><tr><th>기여</th><th>검증 가능한 결과</th></tr><tr><td class=\"\">PageValues 영향 정량화</td><td class=\"\">PR-AUC 0.756 → 0.376, 차이 0.380</td></tr><tr><td class=\"\">「실시간」을 검증 가능한 시점으로 분해</td><td class=\"\">T0 약 0.28(무작위 기준 0.156)</td></tr><tr><td class=\"\">구간으로 모형 차이 판단</td><td class=\"\">XGBoost와 RF 구분 불가</td></tr><tr><td class=\"\">정보에 따른 SHAP 변화 점검</td><td class=\"\">ExitRates 0.289 → 0.635</td></tr><tr><td class=\"\">정확도만 보지 않기</td><td class=\"\">정확도 0.84 = 모두 비구매</td></tr></table>"}, {"k": "한계와 다음 단계", "t": "앞으로 무엇을 하나?", "b": "① 실시간 적용 상황 정의: T0/T1/T2 중 시점을 정하고 클릭 단위 자료로 검증.\n② 모형 선택 근거 강화: 규칙을 미리 정하고 임계값 조정 후 최종 모형 결정.\n③ Prototype 인터페이스 구현 및 출력 대조.\n④ 확률 보정과 임계값 비교 보완.", "n": "한계: 세션 종료값만 있고 사용자 ID·시간 정보가 없으며, SHAP은 인과가 아니다.", "special": ""}, {"k": "결론", "t": "한 문장으로 정리하면", "b": "완전한 세션의 오프라인 자료에서 PageValues가 예측성능을 좌우한다.\n이를 빼면 RF와 XGBoost는 비슷하고, 행동 자료는 여전히 예측력이 있다.\n\n다음 단계는 클릭 단위 자료로 진짜 실시간 예측을 검증하는 것이다.", "n": "감사합니다.", "special": ""}]}; let lang=(()=>{try{return localStorage.getItem('lang')}catch(e){return null}})()||'ko'; let idx=0;

function render(){const s=DATA[lang][idx];document.documentElement.lang=lang==='ko'?'ko':'zh-Hant';const slideEl=document.getElementById('slide');slideEl.classList.remove('page-enter');void slideEl.offsetWidth;slideEl.classList.add('page-enter');slideEl.innerHTML=`<div class="eyebrow">${esc(s.k)}</div><h1>${esc(s.t)}</h1>${s.b?`<div class="body">${esc(s.b)}</div>`:''}${s.special||''}${s.n?`<div class="note">${esc(s.n)}</div>`:''}<div class="count">${idx+1} / ${DATA[lang].length}</div>`;document.querySelector('.bar').style.width=((idx+1)/DATA[lang].length*100)+'%';document.querySelectorAll('.toc').forEach((x,i)=>x.classList.toggle('active',i===idx));document.getElementById('zh').classList.toggle('active',lang==='zh');document.getElementById('ko').classList.toggle('active',lang==='ko');}

function move(d){idx=Math.max(0,Math.min(DATA[lang].length-1,idx+d));render()};
