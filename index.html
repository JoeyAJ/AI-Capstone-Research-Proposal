:root{--bg:#f4f6f8;--paper:#fff;--ink:#172033;--muted:#657084;--line:#dce2e9;--accent:#2f5f96;--accent2:#eaf1f8}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,"Noto Sans KR","Noto Sans TC","Malgun Gothic",Arial,sans-serif;background:var(--bg);color:var(--ink)}
body{overflow:hidden}header{height:58px;display:flex;align-items:center;gap:12px;padding:0 22px;background:#fff;border-bottom:1px solid var(--line)}

.stage{display:flex;align-items:stretch;justify-content:stretch;padding:10px 12px;overflow:hidden}.slide{background:var(--paper);width:100%;height:100%;min-height:0;box-sizing:border-box;box-shadow:0 12px 36px rgba(25,37,54,.10);border:1px solid #e2e6eb;border-radius:3px;padding:42px 58px;position:relative;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-size:15px;color:var(--accent);font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:16px}h1{font-size:clamp(36px,4.4vw,60px);line-height:1.16;margin:0 0 22px;letter-spacing:-.03em}.body{white-space:pre-line;font-size:clamp(21px,2.15vw,29px);line-height:1.65;max-width:970px}.note{margin-top:24px;padding:15px 18px;border-left:4px solid var(--accent);background:#f5f8fb;font-size:19px;line-height:1.6;color:#3d4b5d}.count{position:absolute;right:30px;bottom:22px;color:#8892a0;font-size:13px}
.flow{display:flex;flex-direction:column;align-items:center;gap:7px;margin-top:10px}.node{border:1.5px solid #8493a5;border-radius:8px;padding:12px 18px;text-align:center;background:#fff;min-width:190px;font-size:16px}.node small{display:block;color:#657084;margin-top:4px}.node.wide{min-width:620px}.node.accent{border-color:var(--accent);background:var(--accent2)}.arrow{font-size:22px;color:#60738b}.triple,.double{display:flex;gap:16px}.pipeline{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:45px}.pipeline span{padding:16px 17px;border:1.5px solid #8493a5;border-radius:8px;background:#fff;font-weight:700}.pipeline i{font-style:normal;font-size:24px;color:#60738b}.proto{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:35px}.outputs{display:flex;flex-direction:column;gap:10px}
.nav{position:fixed;right:24px;bottom:20px;display:flex;gap:8px;z-index:5}.help{font-size:12px;color:#7b8795}body.presenter header,body.presenter aside,body.presenter .progress,body.presenter .nav{display:none!important}body.presenter main{height:100vh;grid-template-columns:1fr}body.presenter .stage{padding:0;background:#111;overflow:hidden}body.presenter .slide{width:100vw;height:100vh;min-height:100vh;border:0;border-radius:0;box-shadow:none;padding:7vh 8vw}body.presenter h1{font-size:clamp(44px,5.2vw,76px)}body.presenter .body{font-size:clamp(25px,2.5vw,36px);max-width:1200px}body.presenter .note{font-size:22px}body.presenter .eyebrow{font-size:18px}body.presenter .node{font-size:20px;padding:15px 22px}body.presenter .pipeline span{font-size:19px;padding:18px 20px}

/* Presentation-stage focus */

const DATA={"zh": [{"k": "10/7 回饋修訂報告", "t": "以線上行為資料為基礎之即時購買預測模型開發基礎研究", "b": "以機器學習比較與 SHAP 可解釋性為中心", "n": "AI 캡스톤프로젝트 2\n指導教授：김문홍 교수\n發表人：ZHAOJIA 조가 (202680224)", "special": ""}, {"k": "教授回饋", "t": "10/7 的四項回饋與修訂位置", "b": "", "n": "", "special": "<table class=\"tbl\"><tr><th>教授回饋</th><th>計畫書修訂位置</th><th>發表</th></tr><tr><td>① 整理先行研究：購買預測模型</td><td>第Ⅱ章 先行研究</td><td>P.4</td></tr><tr><td>② SHAP：定義、應用現況</td><td>第Ⅲ章 SHAP</td><td>P.5</td></tr><tr><td>③ 提出各種問題點 → 模型開發研究</td><td>第Ⅳ章 問題點 → 第Ⅴ～Ⅶ章 模型開發</td><td>P.6–P.8</td></tr><tr><td>④ 變數（18 欄）</td><td>第Ⅴ章第 2 節 變數定義</td><td>P.9</td></tr></table>"}, {"k": "架構調整", "t": "把計畫書改成「問題點 → 模型開發」的流程", "b": "", "n": "先提出既有研究的問題點，再接到解決這些問題的模型開發研究，據此重新安排章節順序。", "special": "<div class=\"pipeline tight before\"><em>修訂前</em><span>先行研究一段</span><i>→</i><span>差異性 4 點</span><i>→</i><span>研究方法</span></div><div class=\"pipeline tight after\"><em>修訂後</em><span>Ⅱ 先行研究整理</span><i>→</i><span>Ⅲ SHAP</span><i>→</i><span>Ⅳ 提出問題點</span><i>→</i><span>Ⅴ–Ⅶ 模型開發研究</span></div>"}, {"k": "回饋 ① 先行研究", "t": "一段文字 → 整理 7 篇購買預測模型研究", "b": "", "n": "脈絡：即時系統 → 分類器比較 → 可解釋性與集成最佳化。但都沒有討論「即時情境下哪些變數真的能用」。", "special": "<div class=\"ba\"><div><b>修訂前</b>「先行研究」一段列了 4 篇</div><i>→</i><div class=\"after\"><b>修訂後</b>7 篇依資料、方法、結果、與本研究的關係整理成表（第Ⅱ章）</div></div><table class=\"tbl\"><tr><th>研究</th><th>方法</th><th>與本研究的關係</th></tr><tr><td>Sakar et al. (2019)</td><td>MLP、LSTM、RF</td><td>即時預測的起點、資料來源</td></tr><tr><td>Esmeli et al. (2022)</td><td>情境與忠誠度特徵</td><td>早期預測需要早期就能拿到的資訊</td></tr><tr><td>Javaid et al. (2022)</td><td>分類器 + XAI</td><td>顯示對 PageValues 的依賴</td></tr><tr><td>Abdullah-All-Tanvir et al. (2023)</td><td>梯度提升</td><td>XGBoost 比較的依據</td></tr><tr><td>Satu & Islam (2023)</td><td>特徵工程 + 分類器</td><td>RF 比較的依據</td></tr><tr><td>Liu & Liu (2026)</td><td>SHAP + 最佳化集成</td><td>SHAP 已被應用</td></tr><tr><td>Sheng & Kim (2025)</td><td>結構方程模型（直播電商）</td><td>區分購買意圖與實際購買結果</td></tr></table>"}, {"k": "回饋 ② SHAP", "t": "一句帶過 → 定義・應用現況・限制", "b": "", "n": "所以「使用 SHAP」本身不是新貢獻。本研究看的是「變數設定改變時，解釋會怎麼變」。", "special": "<div class=\"ba\"><div><b>修訂前</b>理論背景中只有 2 句</div><i>→</i><div class=\"after\"><b>修訂後</b>定義與公式、應用現況、限制、使用方式獨立成章（第Ⅲ章）</div></div><div class=\"cards\"><div class=\"card\"><h3>定義</h3>Lundberg & Lee（2017），以 Shapley 值為基礎。<br>預測 = 基準值 + 各變數的貢獻。<br>正值 → 推向購買，負值 → 推向不購買</div><div class=\"card\"><h3>應用現況</h3>① 說明重要因素<br><small>Javaid et al. (2022)</small><br>② 輔助特徵選擇與建模<br><small>Liu & Liu (2026)</small></div><div class=\"card\"><h3>限制</h3>只說明「模型怎麼用變數」，不是因果關係。<br>變數高度相關時，貢獻會被分散。</div></div>"}, {"k": "回饋 ③ 提出問題點", "t": "既有研究的四個問題點", "b": "", "n": "修訂前只有「差異性」4 點，沒有明確寫出問題點。這次連同數字依據一起提出（第Ⅳ章）。", "special": "<table class=\"tbl\"><tr><th>問題點</th><th>依據</th></tr><tr><td class=\"hl\">1. 未檢查預測時點的資訊可得性</td><td class=\"hl\">PageValues > 0 的會話購買率 56.3%，= 0 只有 3.9%<br>資料沒有說明何時計算</td></tr><tr><td>2. 過度依賴準確率</td><td>全部猜「不買」也有約 84% 準確率</td></tr><tr><td>3. 評估程序不透明</td><td>完全重複 125 筆，調參範圍未說明</td></tr><tr><td>4. 把解釋當成行為法則</td><td>SHAP 與重要度不是因果</td></tr></table>"}, {"k": "回饋 ③ → 模型開發研究", "t": "針對每個問題點設計模型開發研究", "b": "", "n": "因此本研究在即時情境下真正可用的變數上開發 LR・RF・XGBoost 模型，用 SHAP 解釋，並連結到 Prototype（第Ⅴ～Ⅶ章）。", "special": "<table class=\"tbl\"><tr><th>問題點</th><th>本研究的對應</th></tr><tr><td>1. 資訊可得性</td><td>比較 A 全部（17）・B 移除 PageValues（16）・C 只用情境變數（8）<br>定義預測時點 T0・T1・T2</td></tr><tr><td>2. 依賴準確率</td><td>以 PR-AUC 為主，並報告 Recall、F1、Brier</td></tr><tr><td>3. 評估不透明</td><td>移除重複、只在訓練資料內調參、bootstrap 95% 區間</td></tr><tr><td>4. 過度解讀</td><td>比較 A・B 設定的 SHAP，並說明解釋的限制</td></tr></table>"}, {"k": "回饋 ③ 初步確認", "t": "初步分析：問題點 1 確實存在", "b": "", "n": "移除 PageValues 後 XGBoost PR-AUC 由 0.756 降到 0.376。資訊的影響大於模型，因此模型開發以 B 設定為中心。", "special": "<img class=\"chart\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkAAAANwCAYAAAB3TqatAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAewgAAHsIBbtB1PgABAABJREFUeJzs3XdYE9nXB/BvCEhXqkiRInbsdRV77921rG0tq2uva1lX17W3tbv2rmvv2HvBhr0gIiBF6SBFenLfP3gzPyYzCQkEVPZ8niePZubOnZthMknumXuPhDHGQAghhBBCCCGEEEIIIYQQUoTofe0GEEIIIYQQQgg →</i><span>연구방법</span></div><div class=\"pipeline tight after\"><em>수정 후</em><span>Ⅱ 선행연구 정리</span><i>→</i><span>Ⅲ SHAP</span><i>→</i><span>Ⅳ 문제점 제시</span><i>→</i><span>Ⅴ–Ⅶ 모형개발 연구</span></div>"}, {"k": "피드백 ① 선행연구", "t": "한 문단 → 구매예측 모형 7편 정리", "b": "", "n": "흐름: 실시간 시스템 제안 → 분류기 비교 → 설명가능성·앙상블 최적화. 그러나 「실시간에 어떤 변수를 쓸 수 있나」는 다루지 않았다.", "special": "<div class=\"ba\"><div><b>수정 전</b>「선행연구 고찰」 한 문단에 4편 나열</div><i>→</i><div class=\"after\"><b>수정 후</b>7편을 자료·방법·결과·본 연구와의 관계로 표 정리 (Ⅱ장)</div></div><table class=\"tbl\"><tr><th>연구</th><th>방법</th><th>본 연구와의 관계</th></tr><tr><td>Sakar et al. (2019)</td><td>MLP, LSTM, RF</td><td>실시간 예측의 출발점, 자료 출처</td></tr><tr><td>Esmeli et al. (2022)</td><td>상황·충성도 특성</td><td>조기 예측엔 초기 정보가 필요</td></tr><tr><td>Javaid et al. (2022)</td><td>분류기 + XAI</td><td>PageValues 의존성</td></tr><tr><td>Abdullah-All-Tanvir et al. (2023)</td><td>그래디언트 부스팅</td><td>XGBoost 비교 근거</td></tr><tr><td>Satu & Islam (2023)</td><td>특성공학 + 분류기</td><td>RF 비교 근거</td></tr><tr><td>Liu & Liu (2026)</td><td>SHAP + 최적화 앙상블</td><td>SHAP이 이미 활용됨</td></tr><tr><td>Sheng & Kim (2025)</td><td>구조방정식(라이브커머스)</td><td>구매의도 vs 실제 구매결과 구분</td></tr></table>"}, {"k": "피드백 ② SHAP", "t": "한 줄 언급 → 정의 · 활용 현황 · 한계", "b": "", "n": "따라서 SHAP 사용 자체는 새 기여가 아니다. 본 연구는 「변수 설정이 바뀌면 설명이 어떻게 달라지는가」를 본다.", "special": "<div class=\"ba\"><div><b>수정 전</b>이론적 배경에서 2문장으로 언급</div><i>→</i><div class=\"after\"><b>수정 후</b>정의·수식, 활용 현황, 한계, 활용 방식을 독립된 장으로 (Ⅲ장)</div></div><div class=\"cards\"><div class=\"card\"><h3>정의</h3>Lundberg & Lee(2017), Shapley 값 기반.<br>예측 = 기준값 + 각 변수의 기여.<br>양수 → 구매 쪽, 음수 → 비구매 쪽</div><div class=\"card\"><h3>활용 현황</h3>① 중요 요인 설명<br><small>Javaid et al. (2022)</small><br>② 특성 선택·모형 구축 보조<br><small>Liu & Liu (2026)</small></div><div class=\"card\"><h3>한계</h3>「모형이 변수를 어떻게 쓰는가」일 뿐 인과관계가 아니다.<br>변수 간 상관이 높으면 기여가 분산된다.</div></div>"}, {"k": "피드백 ③ 문제점 제시", "t": "기존 연구의 문제점 네 가지", "b": "", "n": "수정 전에는 「차별성」 4가지만 있었고 문제점은 명시하지 않았다. 이번에 근거 숫자와 함께 제시했다 (Ⅳ장).", "special": "<table class=\"tbl\"><tr><th>문제점</th><th>근거</th></tr><tr><td class=\"hl\">1. 예측 시점의 정보 가용성 미검토</td><td class=\"hl\">PageValues > 0 세션 구매율 56.3%, = 0 세션 3.9%<br>계산 시점이 공개되지 않음</td></tr><tr><td>2. 정확도에 대한 과도한 의존</td><td>모두 「비구매」로 예측해도 정확도 약 84%</td></tr><tr><td>3. 평가 절차의 불투명성</td><td>완전 중복 125행, 튜닝 범위 미기재</td></tr><tr><td>4. 설명을 행동 법칙으로 해석</td><td>SHAP·중요도는 인과가 아님</td></tr></table>"}, {"k": "피드백 ③ → 모형개발 연구", "t": "문제점마다 대응하는 모형개발 연구", "b": "", "n": "그래서 본 연구는 실시간에 실제로 쓸 수 있는 변수 위에서 LR·RF·XGBoost 모형을 개발하고, SHAP으로 설명하며, Prototype으로 연결한다 (Ⅴ~Ⅶ장).", "special": "<table class=\"tbl\"><tr><th>문제점</th><th>본 연구의 대응</th></tr><tr><td>1. 정보 가용성</td><td>A 전체(17) · B PageValues 제외(16) · C 상황 변수만(8) 비교<br>예측 시점 T0·T1·T2 정의</td></tr><tr><td>2. 정확도 의존</td><td>PR-AUC 주지표 + Recall, F1, Brier</td></tr><tr><td>3. 평가 불투명</td><td>중복 제거, 학습자료 내부 튜닝, 부트스트랩 95% 구간</td></tr><tr><td>4. 과잉 해석</td><td>A·B 설정 SHAP 비교, 해석 한계 명시</td></tr></table>"}, {"k": "피드백 ③ 예비 확인", "t": "예비 분석: 문제점 1이 실제로 확인되었다", "b": "", "n": "PageValues를 빼면 XGBoost PR-AUC 0.756 → 0.376. 모형보다 정보의 영향이 크므로, 모형개발은 B 설정을 중심으로 진행한다.", "special": "<img class=\"chart\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABkAAAANwCAYAAAB3TqatAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjgsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvwVt1zgAAAAlwSFlzAAAewgAAHsIBbtB1PgABAABJREFUeJzs3XdYE9nXB/BvCEhXqkiRInbsdRV77921rG0tq2uva1lX17W3tbv2rmvv2HvBhr0gIiBF6SBFenLfP3gzPyYzCQkEVPZ8niePZubOnZthMknumXuPhDHGQAghhBBCCCGEEEIIIYQQUoTofe0GEEIIIYQQQgghhBBCCCGE6BoFQAghhBBCCCGEEEIIIYQQUuRQAIQQQgghhBBCCCGEEEIIIUUOBUAIIYQQQgghhBBCCCGEEFLkUACEEEIIIYQQQgghhBBCCCFFDgVACCGEEEIIIYQQQgghhBBS5FAAhBBCCCGEEEIIIYQQQgghRQ4FQAghhBBCCCGEEEIIIYQQUuRQAIQQQgghhBBCCCGEEEIIIUUOBUAIIYQQQgghhBBCCCGEEFLkUACEEEIIIYQQQgghhBBCCCFFDgVACCGEEEIIIYQQQgghhBBS5FAAhBBCCCGEEEIIIYQQQgghRQ4FQAghhBBCCCGEEEIIIYQQUuRQAIQQQgghhBBCCCGEEEIIIUUOBUAIIYQQQgghhBBCCCGEEFLkUACEEEIIIYQQQgghhBBCCCFFDgVACCGEEEIIIYQQQgghhBBS5FAAhBBCCCGEEEIIIYQQQgghRQ4FQAghhBBCCCGEEEIIIYQQUuRQAIQQQgghhBBCCCGEEEIIIUUOBUAIIYQQQgghhBBCCCGEEFLkUACEEEIIIYQQQgghhB
